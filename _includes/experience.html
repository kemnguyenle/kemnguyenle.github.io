<section class="section experience">
  <div class="section__title">News</div>
  <div class="section__content">
    <div class="jobs">
      {% for pub in site.data.publication %}
      <div class="job">
        <div class="time-place">
          <div class="job__company">
            {% assign company = pub.company %}
            {% if pub.url != "" and pub.url != nil %}
              <a href="{{pub.url}}" target="_blank">{{ company }}</a>
            {% else %}
              {{ company }}
            {% endif %}
          </div>
        <div class="job__time">{{pub.position}}</div>
        </div>
      </div>
      {% endfor %}
    </div>

    <!-- <a href="{{site.resume}}" target="_blank" class="arrow-link">View My Resume</a> -->
  </div>
</section>
